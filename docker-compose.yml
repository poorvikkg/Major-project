version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mpds_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: poorvik
      POSTGRES_PASSWORD: poorvik123
      POSTGRES_DB: major_project
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
